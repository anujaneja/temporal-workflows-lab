version: "3.8"

# ─── Phase 1 ────────────────────────────────────────────────────────────────
# Services: postgresql (Temporal-internal), temporal, temporal-ui, api, worker
#
# ─── Phase 2 ────────────────────────────────────────────────────────────────
# Added: app-postgres, flyway (schema migrations), redis (reserved for Phase 7+)
#
# Phase 3 will add prometheus, grafana, load-generator, mock-external-api.

services:

  # ── Temporal's internal persistence ─────────────────────────────────────
  postgresql:
    image: postgres:16-alpine
    container_name: temporal-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - temporal-net

  # ── Application PostgreSQL ────────────────────────────────────────────────
  # Separate from Temporal's internal postgres so the two concerns stay isolated.
  # Schema is managed by the flyway service below — no init scripts here.
  app-postgres:
    image: postgres:16-alpine
    container_name: app-postgres
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    volumes:
      - app-postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - temporal-net

  # ── Flyway ───────────────────────────────────────────────────────────────
  # Short-lived container: runs migrations and exits.
  # api and worker depend on service_completed_successfully so they never start
  # against a schema-less database.
  #
  # Migration files live in db/migrations/ at the project root.
  # Flyway tracks applied migrations in the flyway_schema_history table.
  flyway:
    image: flyway/flyway:10-alpine
    container_name: flyway-migrate
    command: migrate
    depends_on:
      app-postgres:
        condition: service_healthy
    environment:
      - FLYWAY_URL=jdbc:postgresql://app-postgres:5432/lab
      - FLYWAY_USER=lab
      - FLYWAY_PASSWORD=lab
      - FLYWAY_CONNECT_RETRIES=10
    volumes:
      - ./db/migrations:/flyway/sql:ro
    networks:
      - temporal-net

  # ── Redis ─────────────────────────────────────────────────────────────────
  # Reserved for Phase 7+ (rate-limit state, fairness counters).
  # Added here so the network topology is stable from Phase 2 onwards.
  redis:
    image: redis:7-alpine
    container_name: app-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - temporal-net

  # ── Temporal Server ──────────────────────────────────────────────────────
  temporal:
    image: temporalio/auto-setup:1.25.2
    container_name: temporal
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address $(hostname -i):7233 2>&1 | grep -q SERVING"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
    networks:
      - temporal-net

  # ── Temporal UI ──────────────────────────────────────────────────────────
  temporal-ui:
    image: temporalio/ui:2.33.0
    container_name: temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8080
    ports:
      - "8080:8080"
    networks:
      - temporal-net

  # ── Go API ───────────────────────────────────────────────────────────────
  api:
    build:
      context: ./go
      target: api
    container_name: temporal-lab-api
    depends_on:
      temporal:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    environment:
      - TEMPORAL_HOST=temporal:7233
      - API_PORT=8081
      - APP_DB_DSN=postgres://lab:lab@app-postgres:5432/lab?sslmode=disable
    ports:
      - "8081:8081"
    networks:
      - temporal-net

  # ── Go Worker ────────────────────────────────────────────────────────────
  worker:
    build:
      context: ./go
      target: worker
    container_name: temporal-lab-worker
    depends_on:
      temporal:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    environment:
      - TEMPORAL_HOST=temporal:7233
      - APP_DB_DSN=postgres://lab:lab@app-postgres:5432/lab?sslmode=disable
    networks:
      - temporal-net

volumes:
  temporal-postgres-data:
  app-postgres-data:

networks:
  temporal-net:
    driver: bridge
